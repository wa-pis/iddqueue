schema: spec-driven
context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: IDDQueue (distribution/import/CLI/repository: iddqueue), самостоятельный GitHub-проект пользователя на основе dalibo/dramatiq-pg.
  Upstream: https://gitlab.com/dalibo/dramatiq-pg, commit 80b1a490d0a494925a9f8be399a11b38cee5480a.
  Scope: синхронный PostgreSQL broker и Results backend для Dramatiq; без ORM.
  Stack: Python >=3.10,<4; Dramatiq >=2.2.1,<3; Psycopg >=3.3.6,<4;
    psycopg-pool >=3.3.3,<4; Tenacity >=9,<10; uv.
  Storage: JSONB, LISTEN/NOTIFY, session advisory locks, таблица очереди и отдельная таблица координации.
  Delivery: at-least-once; задачи должны быть идемпотентными.
  Existing public API: PostgresBroker, PostgresBackend, generate_init_sql, iddqueue CLI.
  Local migration implemented before OpenSpec adoption on 2026-10-02.
  Verified: 175 tests on Python 3.13.14/PostgreSQL 14.20; engineering readiness/graceful lifecycle CI 37547185094 6/6, Ruff/docs/build/LICENSE/installed acceptance.
  GitHub CI passed all six Python 3.10/3.13/3.14 and PostgreSQL 14/18 combinations; run 37541082307; installed base/monitoring wheel acceptance and strict docs checks and installed-wheel quickstart passed.
  GitHub: https://github.com/wa-pis/iddqueue, public, main; 0.13.0rc3 опубликован на GitHub/PyPI через Trusted Publishing, будущая публикация требует отдельного запроса.
  Preserve PostgreSQL license and original contributor credits.
  Feature roadmap: openspec/roadmap.md; previous six features and baseline archived; extend-postgres-capabilities все семь этапов выполнены, main specs синхронизированы; change архивирован 2026-10-03.
  Project maintenance practices completed, project-maintenance main spec synced; change archived 2026-10-04. uv migration completed; uv.lock, native uv_build and locked CI/release gate; change archived 2026-10-04.
  User authorized recording all discussed features in OpenSpec on 2026-10-02.
rules:
  proposal:
    - Distinguish completed local migration from pending GitHub setup.
    - Do not invent new features or treat unknown repository/package names as settled.
  specs:
    - Specify observable behavior with concrete WHEN/THEN scenarios.
  tasks:
    - Mark tasks completed only when supported by actual code or verification evidence.
    - Separate local validation from remote CI and publication.
