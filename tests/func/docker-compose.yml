# Run from the repository root: docker compose -f tests/func/docker-compose.yml up --build --abort-on-container-exit --exit-code-from runner
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
  runner:
    image: python:3.13-slim
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: >-
      sh -c 'pip install poetry && poetry config virtualenvs.in-project false &&
      poetry install --extras "binary monitoring" && poetry run tests/func/entrypoint.sh'
    depends_on:
      postgres:
        condition: service_healthy
