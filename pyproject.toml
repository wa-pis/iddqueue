[project]
name = "iddqueue"
version = "0.13.0"
description = "Postgres Broker for Dramatiq Task Queue"
authors = [{name = "Étienne BERSAC"}]
license = "PostgreSQL"
readme = "README.md"
requires-python = ">=3.10,<4"
keywords = ["postgres", "task queue", "dramatiq"]
dependencies = [
    "dramatiq>=2.2.1,<3",
    "psycopg>=3.3.6,<4",
    "psycopg-pool>=3.3.3,<4",
    "tenacity>=9,<10",
]

[project.urls]
Repository = "https://github.com/wa-pis/iddqueue"
Issues = "https://github.com/wa-pis/iddqueue/issues"

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.3.6,<4"]
monitoring = ["dramatiq[prometheus]>=2.2.1,<3"]

[project.scripts]
iddqueue = "iddqueue.cli:entrypoint"

[tool.poetry]
include = ["iddqueue/schema.sql", "iddqueue/coordination.sql"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-timeout = ">=2"
pytest-mock = ">=3"
dramatiq = {version = ">=2.2.1,<3", extras = ["watch"]}
psycopg = {version = ">=3.3.6,<4", extras = ["binary"]}
docutils = ">=0.21"
pygments = ">=2"
ruff = ">=0.9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
