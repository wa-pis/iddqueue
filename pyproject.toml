[project]
name = "iddqueue"
version = "0.13.0rc1"
description = "Postgres Broker for Dramatiq Task Queue"
authors = [{name = "Étienne BERSAC"}]
license = "PostgreSQL"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4"
keywords = ["postgres", "task queue", "dramatiq"]
dependencies = [
    "dramatiq>=2.2.1,<3",
    "psycopg>=3.3.6,<4",
    "psycopg-pool>=3.3.3,<4",
    "tenacity>=9,<10",
]

[project.urls]
Repository = "https://github.com/wa-pis/iddqueue"
Issues = "https://github.com/wa-pis/iddqueue/issues"

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.3.6,<4"]
monitoring = ["dramatiq[prometheus]>=2.2.1,<3"]

[project.scripts]
iddqueue = "iddqueue.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8", "pytest-timeout>=2", "pytest-mock>=3",
    "dramatiq[watch]>=2.2.1,<3", "psycopg[binary]>=3.3.6,<4",
    "docutils>=0.21", "pygments>=2.20", "ruff>=0.9",
]

fastapi-example = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

docs = ["mkdocs>=1.6.1,<2"]

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "iddqueue"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
