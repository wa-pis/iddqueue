name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13', '3.14']
        postgres: ['14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      IDDQUEUE_TEST_DATABASE: dedicated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@1.12.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - run: uv python find "${{ matrix.python }}"
      - run: uv sync --locked --python "${{ matrix.python }}" --extra binary --extra monitoring --group fastapi-example --group docs
      - run: uv run --no-sync iddqueue init
      - run: uv run --no-sync python tests/pypsql < tests/func/schema.sql
      - run: uv run --no-sync sh scripts/check_release.sh
