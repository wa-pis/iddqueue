name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-0.13.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iddqueue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Download verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release view v0.13.0 --repo wa-pis/iddqueue --json targetCommitish --jq .targetCommitish | \
            awk '$0 != "09a8393377f5335b3cf0eb85c08845cbb9751f3c" { exit 1 }'
          gh release download v0.13.0 --repo wa-pis/iddqueue --dir artifacts \
            --pattern 'iddqueue-0.13.0-py3-none-any.whl' --pattern 'iddqueue-0.13.0.tar.gz'
          cd artifacts
          printf '%s\n' \
            'eaa5e6c855485249908c67eaab24ddfd71b762f2030cefe7cba31f5ec68c1826  iddqueue-0.13.0-py3-none-any.whl' \
            '8531940c89b29e88161e547f1d441b13f52f3c01a8330de315a91862356b4ddb  iddqueue-0.13.0.tar.gz' | sha256sum --check --strict
      - name: Publish exact candidate with OIDC
        run: uv publish --trusted-publishing always artifacts/iddqueue-0.13.0-py3-none-any.whl artifacts/iddqueue-0.13.0.tar.gz
