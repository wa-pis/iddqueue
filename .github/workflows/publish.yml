name: Publish RC to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-0.13.0rc4
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iddqueue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Download verified RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release view v0.13.0rc4 --repo wa-pis/iddqueue --json targetCommitish --jq .targetCommitish | \
            awk '$0 != "ca68594f035b46a4b21e0a8a9ae4ad50da6c6d4f" { exit 1 }'
          gh release download v0.13.0rc4 --repo wa-pis/iddqueue --dir artifacts \
            --pattern 'iddqueue-0.13.0rc4-py3-none-any.whl' --pattern 'iddqueue-0.13.0rc4.tar.gz'
          cd artifacts
          printf '%s\n' \
            '1fd710c4c8a425c736a70812b787ec9145a5e7be45633effc38aa6f9c0fa8938  iddqueue-0.13.0rc4-py3-none-any.whl' \
            '25a03c41578af2b74a1c8da6f04d7d843152f749e6cbe89e7ad60e9135291f8b  iddqueue-0.13.0rc4.tar.gz' | sha256sum --check --strict
      - name: Publish exact candidate with OIDC
        run: uv publish --trusted-publishing always artifacts/iddqueue-0.13.0rc4-py3-none-any.whl artifacts/iddqueue-0.13.0rc4.tar.gz
