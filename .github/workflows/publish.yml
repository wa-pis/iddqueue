name: Publish RC to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-0.13.0rc3
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iddqueue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Download verified RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release view v0.13.0rc3 --repo wa-pis/iddqueue --json targetCommitish --jq .targetCommitish | \
            awk '$0 != "911ca1a3a197b1745af15f6a4bf399cd470ce969" { exit 1 }'
          gh release download v0.13.0rc3 --repo wa-pis/iddqueue --dir artifacts \
            --pattern 'iddqueue-0.13.0rc3-py3-none-any.whl' --pattern 'iddqueue-0.13.0rc3.tar.gz'
          cd artifacts
          printf '%s\n' \
            '25e56080f3871e9fa0553be67b3b21d4ace8b363abe42feab45f8f1363520bf9  iddqueue-0.13.0rc3-py3-none-any.whl' \
            '3bcad9cc15030b3baedc40ef0bcf109d79d3a781f88a5f650f7d9129a540013a  iddqueue-0.13.0rc3.tar.gz' | sha256sum --check --strict
      - name: Publish exact candidate with OIDC
        run: uv publish --trusted-publishing always artifacts/iddqueue-0.13.0rc3-py3-none-any.whl artifacts/iddqueue-0.13.0rc3.tar.gz
