name: Publish RC to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-0.13.0rc2
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iddqueue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Download verified RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release view v0.13.0rc2 --repo wa-pis/iddqueue --json targetCommitish --jq .targetCommitish | \
            awk '$0 != "784bd3044d1a880eb863a6547a7edf4d62bd2bc6" { exit 1 }'
          gh release download v0.13.0rc2 --repo wa-pis/iddqueue --dir artifacts \
            --pattern 'iddqueue-0.13.0rc2-py3-none-any.whl' --pattern 'iddqueue-0.13.0rc2.tar.gz'
          cd artifacts
          printf '%s\n' \
            'de844d3544507c6c3947dde01ee940be0dcf25ee5bd7013285f28eb1535a3d1a  iddqueue-0.13.0rc2-py3-none-any.whl' \
            '8f3f36dbb542715c6b43366ced0a10b67abb2259345710b53e87b18f0ee93dd2  iddqueue-0.13.0rc2.tar.gz' | sha256sum --check --strict
      - name: Publish exact candidate with OIDC
        run: uv publish --trusted-publishing always artifacts/iddqueue-0.13.0rc2-py3-none-any.whl artifacts/iddqueue-0.13.0rc2.tar.gz
