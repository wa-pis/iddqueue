name: Publish RC to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-0.13.0rc5
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iddqueue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Download verified RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release view v0.13.0rc5 --repo wa-pis/iddqueue --json targetCommitish --jq .targetCommitish | \
            awk '$0 != "186542bdf615ea48cb53a8142cc588f5726af5f8" { exit 1 }'
          gh release download v0.13.0rc5 --repo wa-pis/iddqueue --dir artifacts \
            --pattern 'iddqueue-0.13.0rc5-py3-none-any.whl' --pattern 'iddqueue-0.13.0rc5.tar.gz'
          cd artifacts
          printf '%s\n' \
            'b80dc688df636f63c380cbb6a287417260fbd926239ea2d6826621585c22ec36  iddqueue-0.13.0rc5-py3-none-any.whl' \
            '5ed7cbb9a164aef0581b473d9c8fa5b23a7ca171f49287039aae15e7e57a63bc  iddqueue-0.13.0rc5.tar.gz' | sha256sum --check --strict
      - name: Publish exact candidate with OIDC
        run: uv publish --trusted-publishing always artifacts/iddqueue-0.13.0rc5-py3-none-any.whl artifacts/iddqueue-0.13.0rc5.tar.gz
